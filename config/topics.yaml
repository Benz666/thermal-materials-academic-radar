# Public project summaries used for the rule-based "Impact on me" line.
# `keys` are matched against the item text; best-matching projects are named.
projects:
  - name: GaN/AlGaN HEMT multiscale thermal modeling (MLIP → BTE → device)
    keys: [GaN, AlGaN, HEMT, HEMTs, self-heating, hotspot*, near-junction, electrothermal, electro-thermal, power device*, GaN-on-diamond, heat spreader*, junction temperature]
  - name: InGaAs alloy κ with self-trained MLIPs (MLPhonon, Phonon Olympics)
    keys: [InGaAs, III-V, alloy scattering, Deep Potential, DeePMD, MACE, concurrent learning, lattice dynamics]
  - name: Boron arsenide κ, active learning and interface transport
    keys: [boron arsenide, BAs, cubic boron nitride, ultrahigh thermal conductivity, four-phonon]
  - name: Phonon band discretization for deterministic BTE (JAX-BTE)
    keys: [BTE, Boltzmann transport equation, phonon Boltzmann, discrete ordinate*, non-Fourier, quasi-ballistic, ballistic phonon*, TDTR, FDTR, JAX, differentiable*]
  - name: GaN/Al₂O₃ interfaces and dislocation-core phonons
    keys: [dislocation*, interfacial thermal conductance, thermal boundary conductance, interface phonon*, interfacial phonon*, interfacial mode*, Al2O3, sapphire]
  - name: BaTiO₃ dislocations — phonon direction asymmetry (BTE vs EELS)
    keys: [BaTiO3, BaTiO₃, ferroelectric*, domain wall*, vibrational EELS, phonon EELS]
  - name: SrTiO₃ tilt grain boundaries
    keys: [SrTiO3, SrTiO₃, grain boundar*, tilt boundar*, perovskite oxide*]
  - name: MLIP reliability (interpretability, data efficiency, failure modes)
    keys: [interpretab*, explainab*, latent space, data efficien*, data-efficien*, failure mode*, out-of-distribution, softening, uncertainty quantification, universal interatomic potential*, foundation potential*, active learning]
  - name: Automated κ workflows and agents (auto-kappa style)
    keys: [auto-kappa, high-throughput, automated workflow*, LLM agent*, AI agent*, agentic, AiiDA, atomate2, phono3py, ALAMODE]
  - name: GPU/HPC solvers and scientific ML
    keys: [GPU-accelerated, GPU accelerated, CUDA, physics-informed neural network*, PINN, neural operator*, surrogate model*]
