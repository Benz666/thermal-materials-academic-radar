# Thermal Materials Academic Radar — topic taxonomy (Ben-Chi Ma)
#
# Scoring: each `core` term that appears scores 3, each `related` term 1.
# An item joins a theme when that theme's score >= min_score; items that join
# no theme are dropped (tool releases, hot repos and conference/call items use
# their own rules). Matching is whole-word, case-insensitive, except short
# terms with capitals (GaN, MACE, BTE, HEMT …), which are case-sensitive.
# A trailing * means prefix match (interpretab* = interpretable/interpretability).
#
# This file is public. Only use information already public on the personal
# site: no unpublished results, private project names or collaborator names.

min_score: 3

# Papers/preprints also need this total score (sum over themes) to be listed.
min_paper_score: 5

# Computation & theory first (owner preference, 2026-11-18). Papers and
# preprints that read as computational/theoretical get a bonus; papers that read
# as purely experimental (synthesis, fabrication, measurement) get a penalty, so
# most of them fall below min_paper_score. Papers with both get a small bonus.
approach:
  computational_bonus: 3
  mixed_bonus: 1
  experimental_penalty: 5      # 2+ experimental cues and no computational cue; 1 cue → 3
  computational:
    - first-principles
    - first principles
    - ab initio
    - density functional
    - DFT
    - molecular dynamics
    - MD simulation*
    - atomistic simulation*
    - simulat*
