# Tools the owner uses day to day (public list from the personal site).
# Any item that mentions one is tagged "Your tools" on the site; industry /
# blog / release items get +3 per tool (max +6) and are kept even when they
# match no theme, so improvements to these tools are never filtered out.
# Format: label: [patterns]
my_tools:
  VASP: [VASP, Vienna Ab initio]
  LAMMPS: [LAMMPS]
  phonopy / phono3py: [phonopy, phono3py]
  ALAMODE: [ALAMODE]
  DeePMD-kit: [DeePMD*, Deep Potential*, DPA-*]
  MACE: [MACE]
  NequIP / Allegro: [NequIP, Allegro]
  JAX: [JAX]
  CUDA: [CUDA, cuBLAS, cuFFT, cuSOLVER, cuEquivariance, CUDA-X]
  NVIDIA Warp: [NVIDIA Warp, Warp kernel*]
  NVIDIA ALCHEMI: [ALCHEMI]
  PhysicsNeMo: [PhysicsNeMo, NVIDIA Modulus]
  ASE / pymatgen: [ASE, Atomic Simulation Environment, pymatgen]
  HTCondor: [HTCondor]
  kALDo: [kALDo, kaldo]
# Platform-level tools: tagged and boosted, but on their own they do not keep
# an item (CUDA appears in gaming and cloud-ops posts too).
weak_tools: [CUDA]

