# ---------------------------------------------------------------- special issues
# Journal "collections / calls for papers" pages that allow automated reading.
# Publishers that block robots (Elsevier, AIP, ASME, APS, ACS, IOP, IEEE) are
# covered by the weekly Claude web search (see CLAUDE_ROUTINE.md).
# MDPI and Frontiers are excluded on purpose.
special_issue_pages:
  - { name: npj Computational Materials, url: "https://www.nature.com/npjcompumats/collections", link_contains: "/collections/" }
  - { name: Nature Communications, url: "https://www.nature.com/ncomms/calls-for-papers", link_contains: "/collections/" }
  - { name: Communications Materials, url: "https://www.nature.com/commsmat/collections", link_contains: "/collections/" }
  - { name: Communications Engineering, url: "https://www.nature.com/commseng/collections", link_contains: "/collections/" }
  - { name: Nature Electronics, url: "https://www.nature.com/natelectron/collections", link_contains: "/collections/" }
  - { name: Scientific Reports, url: "https://www.nature.com/srep/collections", link_contains: "/collections/" }
