  - { name: NVIDIA Blog, url: "https://blogs.nvidia.com/feed/", filter: true }
  - { name: Microsoft Research AI for Science, url: "https://www.microsoft.com/en-us/research/lab/microsoft-research-ai-for-science/feed/", filter: false }
  - { name: AWS HPC Blog, url: "https://aws.amazon.com/blogs/hpc/feed/", filter: true }
  - { name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", filter: true }
  - { name: Google Research, url: "https://research.google/blog/rss/", filter: true }
  - { name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/", filter: true }
  - { name: OpenAI, url: "https://openai.com/news/rss.xml", filter: true }
  - { name: Semiconductor Engineering, url: "https://semiengineering.com/feed/", filter: true }
