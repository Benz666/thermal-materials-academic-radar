  - { name: DeePMD-kit, repo: deepmodeling/deepmd-kit }
  - { name: DP-GEN2, repo: deepmodeling/dpgen2 }
  - { name: MACE, repo: ACEsuit/mace }
  - { name: NequIP, repo: mir-group/nequip }
  - { name: Allegro, repo: mir-group/allegro }
  - { name: fairchem (Meta FAIR), repo: facebookresearch/fairchem }
  - { name: MatterSim (Microsoft), repo: microsoft/mattersim }
  - { name: Orb models (Orbital Materials), repo: orbital-materials/orb-models }
  - { name: SevenNet, repo: MDIL-SNU/SevenNet }
  - { name: MatGL, repo: materialyzeai/matgl }
  - { name: phonopy, repo: phonopy/phonopy }
  - { name: phono3py, repo: phonopy/phono3py }
  - { name: ALAMODE, repo: ttadano/alamode }
  - { name: TDEP, repo: tdep-developers/tdep }
  - { name: pymatgen, repo: materialsproject/pymatgen }
  - { name: JAX, repo: jax-ml/jax }
  - { name: JAX MD, repo: jax-md/jax-md }
  - { name: NVIDIA cuEquivariance, repo: NVIDIA/cuEquivariance }
  - { name: NVIDIA Warp, repo: NVIDIA/warp }
  - { name: e3nn, repo: e3nn/e3nn }
  - { name: NVIDIA PhysicsNeMo, repo: NVIDIA/physicsnemo }
  - { name: NVIDIA ALCHEMI Toolkit, repo: NVIDIA/nvalchemi-toolkit }
  - { name: kALDo, repo: nanotheorygroup/kaldo }
  - { name: dpdata, repo: deepmodeling/dpdata }

# GitHub "hot repos": repositories matching these searches that were pushed
# in the lookback window, sorted by stars. Star growth is tracked day to day.
hot_repos:
  min_stars: 30
  queries:
    - "topic:interatomic-potentials"
    - "topic:machine-learning-potentials"
    - "topic:molecular-dynamics"
    - "topic:phonons"
    - "topic:density-functional-theory"
    - "topic:materials-science agent"
    - "topic:computational-materials-science"
    - "thermal conductivity in:description"
    - "heat transfer simulation in:description"
    - "thermal simulation chip in:description"

# ---------------------------------------------------------------- industry
