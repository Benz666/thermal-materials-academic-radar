name: Daily radar

on:
  schedule:
    # Primary trigger: the owner's always-on Ubuntu machine dispatches this
    # workflow at 6 am US Eastern (systemd timer, input auto=true).
    # GitHub's own schedule can start hours late, so these are only backups;
    # every automatic trigger skips if today's run already happened.
    - cron: "0 12 * * *"        # 7 am EST / 8 am EDT
    - cron: "30 13 * * *"       # 8:30 am EST
  workflow_dispatch:
    inputs:
      auto:
        description: "Automatic daily trigger (skip if already ran today)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/llm_out/*.json"   # manually added Claude output → merge + redeploy (no fetch)
      - "config/**"
      - "web/**"
      - "radar/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/health.json
          sparse-checkout-cone-mode: false
      - id: c
        run: |
          last=$(python3 -c "import json;print(json.load(open('data/health.json')).get('run',''))" 2>/dev/null || true)
          lastday=$([ -n "$last" ] && TZ=America/New_York date -d "$last" +%F || echo none)
          today=$(TZ=America/New_York date +%F)
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; } && [ "$lastday" = "$today" ]; then
            echo "Already ran today ($last); skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  run:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch and build (scheduled / manual)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # optional
        run: |
          python -m radar.run --ingest
          python -m radar.run

      - name: Claude summaries (Claude Code, subscription token)
        if: github.event_name != 'push' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        timeout-minutes: 25
        continue-on-error: true      # the site still deploys with rule-based summaries
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          WEEKLY=$([ "$(date -u +%u)" = "1" ] && echo "Today is Monday: also do the weekly steps." || echo "Today is not Monday: skip the weekly steps.")
          claude -p "Follow CLAUDE_ROUTINE.md in this repository for today ($(date -u +%F), UTC). $WEEKLY Do not run git; the workflow commits your files." \
            --model claude-sonnet-5-5 \
            --allowedTools "Read" "Glob" "Grep" "WebSearch" "WebFetch" \
                           "Write(data/llm_out/**)" "Edit(data/llm_out/**)" \
                           "Write(data/proposals/**)" "Edit(data/proposals/**)" \
                           "Bash(python3 -m json.tool:*)" \
            --max-turns 60 | tail -n 20
          python -m radar.run --ingest

      - name: Merge Claude output and rebuild (push)
        if: github.event_name == 'push'
        run: python -m radar.run --ingest

      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Radar data $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
